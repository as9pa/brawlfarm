    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <!-- The browser chrome on the first paint, before React runs. These two cover the
         "system" setting; App.tsx adds a third with no media when the setting names a
         theme, which overrides them. -->
    <meta name="theme-color" content="#F3F4F6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0C0F14" media="(prefers-color-scheme: dark)" />
    <title>brawlfarm</title>

      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23E0B84B'/%3E%3C/svg%3E"
    />

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
