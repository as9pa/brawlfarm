[project]
name = "brawlfarm"
version = "0.1.0"
description = "Open-source Brawl Stars trophy farmer for BlueStacks, with a local control panel"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
  "opencv-python>=4.10",
  "numpy>=2.0",
  "requests>=2.32",
  "python-dotenv>=1.0",
  "rapidocr-onnxruntime>=1.3",
  "pandas>=2.2",
  "pydantic>=2.9",
  "tomli-w>=1.1",
  "psutil>=6.1",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.scripts]
brawlfarm = "brawlfarm.__main__:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.12", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brawlfarm"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".pytest_cache"
pythonpath = ["."]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
# Two import-time deprecations from the TestClient's own dependencies, scoped to their
# exact message so any other deprecation still surfaces. Drop each one when its emitter
# is upgraded past it.
filterwarnings = [
  # starlette 1.6.0 prefers httpx2 and warns on the httpx fallback; the plan pins httpx.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
  # starlette 1.6.0's module body still uses the alias anyio 4.15 deprecated.
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
