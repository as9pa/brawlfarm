[project]
name = "brawlfarm"
version = "0.1.0"
description = "Open-source Brawl Stars trophy farmer for BlueStacks, with a local control panel"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
  "opencv-python>=4.10",
  "numpy>=2.0",
  "requests>=2.32",
  "python-dotenv>=1.0",
  "rapidocr-onnxruntime>=1.3",
  "pandas>=2.2",
]

[project.scripts]
brawlfarm = "brawlfarm.__main__:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brawlfarm"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".pytest_cache"
pythonpath = ["."]
